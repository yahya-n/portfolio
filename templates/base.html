{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ profile.title_name }}</title>
    {% if profile.favicon_icon %}
    <link rel="icon" type="image/png" href="{{ profile.favicon_icon.url }}">
    <!-- 
        Note: Favicons cannot be styled with CSS. 
        To display a circular favicon, upload a circular PNG image with a transparent background.
    -->
    {% endif %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS Animation Library -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <!--link rel="stylesheet" href="{% static 'css/styles.css' %}"-->
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Navbar Styles */
        .navbar {
            background: linear-gradient(90deg, #0a2540 0%, #00adfd 100%);
            box-shadow: 0 4px 24px rgba(10, 37, 64, 0.08);
            border-bottom: 2px solid #00adfd;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.3s;
        }
        .navbar-brand {
            color: #fff !important;
            font-size: 2rem;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,173,253,0.15);
        }
        .navbar-toggler {
            border: none;
        }
        .navbar-toggler:focus {
            box-shadow: none;
        }
        .navbar-nav .nav-link {
            color: #e6f1fa !important;
            font-weight: 500;
            font-size: 1.1rem;
            margin: 0 0.5rem;
            position: relative;
            transition: color 0.2s;
        }
        .navbar-nav .nav-link::after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #fff;
            transition: width 0.3s;
            position: absolute;
            left: 0;
            bottom: -4px;
        }
        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #fff !important;
        }
        .navbar-nav .nav-link:hover::after,
        .navbar-nav .nav-link.active::after {
            width: 100%;
        }
        @media (max-width: 991.98px) {
            .navbar-nav .nav-link {
                margin: 0.5rem 0;
                text-align: center;
            }
        }

        /* Navbar Style 2

    </style>
    <script>
        // Optional: Highlight active nav link on scroll
        document.addEventListener('DOMContentLoaded', function () {
            const sections = ['home', 'about', 'skills', 'projects', 'contact'];
            const navLinks = document.querySelectorAll('.nav-link');
            window.addEventListener('scroll', function () {
                let current = '';
                sections.forEach(id => {
                    const section = document.getElementById(id);
                    if (section && window.scrollY >= section.offsetTop - 80) {
                        current = id;
                    }
                });
                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
        });

        // Contact form mailto handler (if form exists)
        if (document.getElementById('contactForm')) {
            document.getElementById('contactForm').onsubmit = function (e) {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const message = document.getElementById('message').value;
                const mailtoLink = `mailto:{{ profile.email }}?subject=Message from ${name}&body=Name: ${name}%0AEmail: ${email}%0AMessage: ${message}`;
                window.location.href = mailtoLink;
            };
        }
    </script>
    
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#home">{{ profile.name }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home"><b>Home</b></a></li>
                    <li class="nav-item"><a class="nav-link" href="#about"><b>About</b></a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills"><b>Skills</b></a></li>
                    <li class="nav-item"><a class="nav-link" href="#projects"><b>Projects</b></a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact"><b>Contact</b></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="bg-gradient text-white text-center py-4">
        <p>&copy; {{ profile.name }} - {{ current_year }} | All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init();  // Initialize AOS animations
    </script>
</body>
</html>
