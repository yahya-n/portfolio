<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Portfolio Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f8f9fa; }
        .register-container { max-width: 400px; margin: 60px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); padding: 2rem; }
        .otp-input { letter-spacing: 0.5em; text-align: center; }
    </style>
</head>
<body>
<div class="register-container">
    <h2 class="mb-4 text-center">Create Account</h2>
    <form method="post" id="registerForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <div id="otpSection" style="display:none;">
        <p class="mt-3">Enter the OTP sent to your email:</p>
        <input type="text" maxlength="6" class="form-control otp-input mb-2" id="otpInput" autocomplete="one-time-code">
        <button class="btn btn-success w-100" id="verifyOtpBtn">Verify OTP</button>
    </div>
    <div class="mt-3 text-center">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
</div>
<script>
    // Simulate OTP flow for UI demo (replace with backend logic)
    document.getElementById('registerForm').onsubmit = function(e) {
        e.preventDefault();
        this.style.display = 'none';
        document.getElementById('otpSection').style.display = 'block';
    };
    document.getElementById('verifyOtpBtn').onclick = function() {
        alert('OTP Verified! Registration complete.');
        window.location.href = "{% url 'login' %}";
    };
</script>
</body>
</html>
